[project]
name = "payment-plan-assistant"
version = "0.1.0"
description = "CLI assistant that shows and changes a payment plan, built on polycog-cognition"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "polycog-cognition==1.0.2",
    "pydantic-ai-slim[openai]~=2.56.0",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
